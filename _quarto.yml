format:
  html:
    theme:
      light: spacelab  #spacelab #flatly or lux
      #dark: cyborg #darkly
    css: styles.css
    toc: true
    # preload the above-the-fold fonts — otherwise they aren't discovered until
    # styles.css has been fetched and parsed. crossorigin is required for fonts.
    include-in-header:
      - text: |
          <link rel="preload" href="/fonts/charter-400.woff2" as="font" type="font/woff2" crossorigin>
          <link rel="preload" href="/fonts/generalsans-400.woff2" as="font" type="font/woff2" crossorigin>
    include-after-body:
      - _nav-sparkline.html
    
editor: visual

